<script>
(function(){
  function yokla(){
    Canli.get('/api/durum', 8000).then(function(r){
      if(r.ok){ Canli.dot('on', 'Canlı'); return; }
      var s = Canli.snapLoad('durum');
      Canli.dot(s ? 'orta' : 'off', s ? ('Önbellek ' + Canli.snapSaat(s.zaman)) : 'Çevrimdışı');
    });
  }
  yokla(); setInterval(yokla, 30000);
})();
