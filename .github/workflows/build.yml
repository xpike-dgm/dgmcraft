# v* etiketi itilince Windows exe derler ve Release'e ekler.
# Örnek: git tag v0.21.0; git push origin v0.21.0
name: build
on:
  push:
    tags:
      - "v*"
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: python -m PyInstaller --noconfirm --windowed --name DgmCraft --paths launcher --add-data "launcher/assets;launcher/assets" --add-data "site;site" --icon "launcher/assets/brand/DgmCraft-app-icon.ico" launcher/app.py
      - run: python -m PyInstaller --noconfirm --windowed --onefile --name DgmCraft-Kurulum --paths launcher --add-data "launcher/assets;launcher/assets" --icon "launcher/assets/brand/DgmCraft-app-icon.ico" launcher/stub/kurulum_stub.py
      - run: Compress-Archive -Path dist/DgmCraft/* -DestinationPath DgmCraft-windows.zip
      - run: certutil -hashfile DgmCraft-windows.zip SHA256 | Select-Object -Skip 1 -First 1 | ForEach-Object { "$($_.Trim())  DgmCraft-windows.zip" } | Out-File -Encoding ascii DgmCraft-windows.zip.sha256
        shell: powershell
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            DgmCraft-windows.zip
            DgmCraft-windows.zip.sha256
            dist/DgmCraft-Kurulum.exe
          generate_release_notes: true
